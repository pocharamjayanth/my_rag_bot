stages:
  - quality
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -m venv venv
  - source venv/bin/activate || venv\Scripts\activate
  - pip install -r requirements.txt
  - pip install ruff mypy bandit vulture uv

analysis_quality:
  stage: quality
  script:
    - ruff check app.py
    - mypy app.py

analysis_security:
  stage: security
  script:
    - bandit -r app.py
    - vulture app.py --min-confidence 80
    - uv audit
