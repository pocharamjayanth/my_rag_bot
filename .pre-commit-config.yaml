repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: "Stage 1: Linting & Formatting (Ruff)"
        args: [ --fix ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: "Stage 2: Type Checking (Mypy)"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: "Stage 3: Security Auditing (Bandit)"
        args: ["-r", "app.py"]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        name: "Stage 4: Dead Code Detection (Vulture)"
        args: ["app.py", "--min-confidence", "80"]

  - repo: local
    hooks:
      - id: uv-audit
        name: "Stage 5: Package Dependency Audit (uv audit)"
        entry: powershell -Command "uv audit"
        language: system
        files: requirements.txt
        pass_filenames: false
