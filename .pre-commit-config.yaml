repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: "Stage 1: Linting & Formatting (Ruff)"
        args: [ --fix ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: "Stage 2: Type Checking (Mypy)"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: "Stage 3: Security Auditing (Bandit)"
        args: ["-r", "app.py"]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        name: "Stage 4: Dead Code Detection (Vulture)"
        args: ["app.py", "--min-confidence", "80"]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.16.0
    hooks:
      - id: pyupgrade
        name: "Stage 5: Syntax Upgrade (Pyupgrade)"
        args: [--py310-plus]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        name: "Stage 6: Code Style (Flake8)"
        args: ["--max-line-length=120"]

  - repo: https://github.com/returntocorp/semgrep
    rev: v1.75.0
    hooks:
      - id: semgrep
        name: "Stage 7: Semantic Guardrails (Semgrep)"
        args: ["--config=auto", "--error"]

  - repo: local
    hooks:
      - id: uv-audit
        name: "Stage 8: Package Dependency Audit (uv audit)"
        entry: powershell -Command "uv audit"
        language: system
        files: requirements.txt
        pass_filenames: false

      - id: pylint
        name: "Stage 9: Deep Code Analysis (Pylint)"
        entry: powershell -Command "pylint app.py --disable=C0114,C0115,C0116"
        language: system
        files: app.py
